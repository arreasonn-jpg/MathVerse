name: Paket üret

# Elle çalıştırılabilir:  GitHub → Actions → "Paket üret" → Run workflow
# Etiket atıldığında (örn. v1.0.0) otomatik çalışır ve dosyaları sürüm yayınına ekler.
# Üretilenler her durumda ilgili çalışmanın "Artifacts" bölümünden indirilebilir.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  paketle:
    name: ${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: Windows (kurulum + taşınabilir)
            os: windows-latest
            komut: npm run dist:win
            kisa: win
            eser: |
              LabirentProtokolu-Kurulum-*.exe
              LabirentProtokolu-Tasinabilir-*.exe
              LabirentProtokolu-Klasor-*.zip
          - ad: Linux (AppImage + deb)
            os: ubuntu-latest
            komut: npm run dist:linux
            kisa: linux
            eser: |
              LabirentProtokolu-*.AppImage
              LabirentProtokolu-*.deb
          - ad: macOS (dmg, Intel + Apple Silicon)
            os: macos-latest
            komut: npm run dist:mac
            kisa: mac
            eser: LabirentProtokolu-*.dmg

    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Testler (oyun + masaüstü katmanı + paketleme şeması + görsel render)
        run: npm run verify

      - name: Paketi üret
        run: ${{ matrix.komut }} -- --publish never
        env:
          # Kod imzalama sertifikası tanımlı değilse paket imzasız üretilir.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Sağlama toplamı üret (SHA-256)
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then S="sha256sum"; else S="shasum -a 256"; fi
          $S *.exe *.zip *.dmg *.AppImage *.deb 2>/dev/null > "SHA256SUMS-${{ matrix.kisa }}.txt" || true
          cat "SHA256SUMS-${{ matrix.kisa }}.txt" 2>/dev/null || true
          {
            echo "### Sağlama toplamları (${{ matrix.kisa }})"
            echo '```'
            cat "SHA256SUMS-${{ matrix.kisa }}.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Paket çıktısını listele
        shell: bash
        run: |
          echo "--- dist/ içeriği ---"
          ls -laR dist 2>&1 | head -60 || true
          {
            echo "### ${{ matrix.ad }}"
            echo '```'
            ls -laR dist 2>&1 | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -laR dist > dist/_icerik.txt 2>&1 || true

      - name: Üretilen dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ad }}
          path: |
            dist
            !dist/*.blockmap
            !dist/*.yml
          if-no-files-found: warn
          retention-days: 30

      - name: Sürüm yayınına ekle (yalnızca etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r -d '' NOTES <<'EOF' || true
          **Inferno Protocol görselliğinde, Labirent: Ölümcül Kaçış mantığında birinci şahıs hayatta kalma-korku oyunu.**

          ### v1.2.0 — neler değişti
          - **Grafikler profesyonel seviyeye çıkarıldı:** 256 px normal haritalı dokular, yakın duvarlarda tam ışık ve gerçek spekülar, duvar dibi temas gölgesi (AO), ufuk sisine bağlanan uzak duvarlar, GPU'da çizilen gökyüzü katmanı (gradyan + güneş/ay + yıldız + kayan bulutlar), çift doğrusal sprite ölçekleme ve 2× çözünürlüklü yaratık/kulübe/Kutu sprite'ları, yeniden dengelenmiş gece/fener ışığı.
          - **Kontroller profesyonel seviyeye çıkarıldı:** dengeli/hassas/yumuşak fare eğrileri, kare hızından bağımsız yumuşatma, dikey bakışta doğru açısal dönüşüm, koşu ve eğilme için basılı tut / aç-kapa kipi, kamera sallanması şiddeti, nişan yardımı, kol ölü bölgesi-tepki eğrisi-hassasiyeti, titreşim ve **tam tuş atama ekranı** (23 eylem, değiştir/sil/sıfırla).
          - **Yaşam alanı güvenli:** Kayran'da (kamp, Kutu, baraka çevresi) artık **hiçbir yaratık yok** — Grievers ve Böcek Bıçakları yalnızca labirent içinde avlanır; güvenli bölgeye giren yaratık anında dışarı atılır.
          - **Performans:** iç çözünürlük yeniden dengelendi (Yüksek=640p, Orta=512p, Performans=384p) ve render yolu ~5× hızlandırıldı; yeni **Otomatik iç ölçekleme** kare süresini ölçüp ölçeği kendi ayarlar.

          ### İndir
          | Platform | Dosya |
          |---|---|
          | Windows | `LabirentProtokolu-Kurulum-*-x64.exe` — kurulum (masaüstü + Başlat menüsü kısayolu) |
          | Windows | `LabirentProtokolu-Tasinabilir-*-x64.exe` — kurulumsuz, USB'den çalışır |
          | macOS | `LabirentProtokolu-*-arm64.dmg` (Apple Silicon) · `-x64.dmg` (Intel) |
          | Linux | `LabirentProtokolu-*-x86_64.AppImage` (`chmod +x` sonra çift tıkla) · `*-amd64.deb` (`sudo dpkg -i`) |

          ### Çalıştırma
          1. Dosyayı indir, çalıştır. Windows'ta "bilinmeyen yayıncı" uyarısı çıkarsa **Ek bilgi → Yine de yükle**.
          2. Oyun Türkçe açılır. Kayıtlar ve ayarlar kullanıcı klasörüne yazılır; kaldırma bunları silmez.

          Kontroller, kayıt konumları, sistem gereksinimleri ve sorun giderme: `docs/KURULUM.md`
          EOF
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "LABİRENT PROTOKOLÜ $GITHUB_REF_NAME" --notes "$NOTES" || true
          fi
          for f in dist/*.exe dist/*.zip dist/*.dmg dist/*.AppImage dist/*.deb dist/SHA256SUMS-*.txt; do
            [ -e "$f" ] && gh release upload "$GITHUB_REF_NAME" "$f" --clobber || true
          done
