name: Paket üret

# Elle çalıştırılabilir:  GitHub → Actions → "Paket üret" → Run workflow
# Etiket atıldığında (örn. v1.0.0) otomatik çalışır ve dosyaları sürüm yayınına ekler.
# Üretilenler her durumda ilgili çalışmanın "Artifacts" bölümünden indirilebilir.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  paketle:
    name: ${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: Windows (kurulum + taşınabilir)
            os: windows-latest
            komut: npm run dist:win
            kisa: win
            eser: |
              LabirentProtokolu-Kurulum-*.exe
              LabirentProtokolu-Tasinabilir-*.exe
              LabirentProtokolu-Klasor-*.zip
          - ad: Linux (AppImage + deb)
            os: ubuntu-latest
            komut: npm run dist:linux
            kisa: linux
            eser: |
              LabirentProtokolu-*.AppImage
              LabirentProtokolu-*.deb
          - ad: macOS (dmg, Intel + Apple Silicon)
            os: macos-latest
            komut: npm run dist:mac
            kisa: mac
            eser: LabirentProtokolu-*.dmg

    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Testler (oyun + masaüstü katmanı + paketleme şeması + görsel render)
        run: npm run verify

      - name: Paketi üret
        run: ${{ matrix.komut }} -- --publish never
        env:
          # Kod imzalama sertifikası tanımlı değilse paket imzasız üretilir.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Sağlama toplamı üret (SHA-256)
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then S="sha256sum"; else S="shasum -a 256"; fi
          $S *.exe *.zip *.dmg *.AppImage *.deb 2>/dev/null > "SHA256SUMS-${{ matrix.kisa }}.txt" || true
          cat "SHA256SUMS-${{ matrix.kisa }}.txt" 2>/dev/null || true
          {
            echo "### Sağlama toplamları (${{ matrix.kisa }})"
            echo '```'
            cat "SHA256SUMS-${{ matrix.kisa }}.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Paket çıktısını listele
        shell: bash
        run: |
          echo "--- dist/ içeriği ---"
          ls -laR dist 2>&1 | head -60 || true
          {
            echo "### ${{ matrix.ad }}"
            echo '```'
            ls -laR dist 2>&1 | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -laR dist > dist/_icerik.txt 2>&1 || true

      - name: Üretilen dosyaları yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ad }}
          path: |
            dist
            !dist/*.blockmap
            !dist/*.yml
          if-no-files-found: warn
          retention-days: 30

      - name: Sürüm yayınına ekle (yalnızca etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r -d '' NOTES <<'EOF' || true
          **Inferno Protocol görselliğinde, Labirent: Ölümcül Kaçış mantığında birinci şahıs hayatta kalma-korku oyunu.**

          ### v1.2.0 — neler değişti

          **1) Grafikler — pikselli görünüm bitti, gerçek GPU hattı geldi.**
          Dünya artık CPU'da düşük çözünürlükte değil, **GPU'da (WebGL) ekranın gerçek çözünürlüğünde** çiziliyor: süper örneklemeli (SSAA) kenar yumuşatma, mipmap + 8× anizotropik doku filtreleme, gerçek 3B duvar/tavan ağları, piksel başına normal haritalı ışık (güneş + fener nokta ışığı + spekülar), gökyüzüne bağlanan üstel sis, ışın izlemeli gökyüzü (gradyan + güneş/ay + yıldız + fbm bulutlar) ve ACES ton eşlemeli son işleme (bloom, renk sapması, vinyet, film greni). Doku atlası yeniden kuruldu; 100+ karo kimliğinin tamamı (rune taşları, kapılar dâhil) doğru dokusuyla görünüyor. GPU açılmazsa oyun **otomatik olarak CPU hattına döner** ve sebebini Ayarlar'da yazar — asla siyah ekran yok.

          **2) Kontroller — profesyonel seviye paketi.**
          120 Hz alt adımlı, kare hızından bağımsız hareket; **ham fare girdisi** (işletim sistemi hızlandırması kapalı); X/Y için ayrı hassasiyet; **nişan (ADS) hassasiyeti** (sağ tuş veya kol LT ile hassasiyet düşer, görüş daralır); kol için **çift bölgeli tepki eğrisi + radyal ölü bölge**; koşarken FOV vuruşu, yana yürürken kamera yatması, inişte kamera yaylanması; fare yumuşatma varsayılanı düşürüldü. Tüm eylemler yeniden atanabilir (23 eylem).

          **3) Harita — 500 × 500 karo (labirent alanı ~15.8×).**
          159 × 159'dan **500 × 500**'e: toplam alan 10.8×, labirent kuşağı 10.430 → 164.738 karo (15.8×), yürünebilir alan ~100.880 karo. Kayran ve yaşam alanı aynı kaldı, çevresi çok daha büyük; içerik ölçeklendi (420 bitki, 22 istasyon, 48 kaynak, 20 böcek bıçağı, günde min(34, 16+gün×2) kapı); yol bulma havuzlanmış tamponlara alındı, sisin ötesi hiç taranmıyor, uzak bölüm ağları bellekten düşürülüyor.

          **Yaşam alanı kuralı korundu:** Kayran'da hiçbir yaratık yok; Grievers ve Böcek Bıçakları yalnızca labirentte avlanır (test: en yakın yaratık-kare 11.69 karo > 10.5 sınır).

          ### İndir
          | Platform | Dosya |
          |---|---|
          | Windows | `LabirentProtokolu-Kurulum-*-x64.exe` — kurulum (masaüstü + Başlat menüsü kısayolu) |
          | Windows | `LabirentProtokolu-Tasinabilir-*-x64.exe` — kurulumsuz, USB'den çalışır |
          | Windows | `LabirentProtokolu-Klasor-*-x64.zip` — klasöre çıkar, çalıştır |
          | macOS | `LabirentProtokolu-*-arm64.dmg` (Apple Silicon) · `-x64.dmg` (Intel) |
          | Linux | `LabirentProtokolu-*-x86_64.AppImage` (`chmod +x` sonra çift tıkla) · `*-amd64.deb` (`sudo dpkg -i`) |

          ### Çalıştırma
          1. Dosyayı indir, çalıştır. Windows'ta "bilinmeyen yayıncı" uyarısı çıkarsa **Ek bilgi → Yine de yükle**.
          2. Oyun Türkçe açılır. Kayıtlar ve ayarlar kullanıcı klasörüne yazılır; kaldırma bunları silmez.
          3. Grafik hattını karşılaştırmak için: Ayarlar → GRAFİK HATTI (Otomatik / GPU / CPU).

          Kontroller, kayıt konumları, sistem gereksinimleri ve sorun giderme: `docs/KURULUM.md` · Sürüm notları: `docs/SURUM-1.2.0.md`
          EOF
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "LABİRENT PROTOKOLÜ $GITHUB_REF_NAME" --notes "$NOTES" || true
          fi
          for f in dist/*.exe dist/*.zip dist/*.dmg dist/*.AppImage dist/*.deb dist/SHA256SUMS-*.txt; do
            [ -e "$f" ] && gh release upload "$GITHUB_REF_NAME" "$f" --clobber || true
          done
